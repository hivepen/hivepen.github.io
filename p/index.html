<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hivepen Profile Hub | Quick Hive Profile Links</title>
  <meta name="description"
    content="Open a Hive account profile across popular frontends with Hivepen's quick profile hub.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://hivepen.github.io/p/">
  <link rel="stylesheet" href="../assets/styles/main.css">
  <link rel="icon" href="../public/img/logo/hivepen-logo-nobg.svg" type="image/svg+xml">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .input-wrapper>input:before {
      content: '@';
      font-weight: 900;
    }
  </style>
</head>

<body x-data="{
          username: 'carlosepc',
          init() {
              const urlParams = new URLSearchParams(window.location.search);
              this.username = urlParams.get('u') || 'carlosepc';
          }
      }">
  <div class="orb orb-primary"></div>
  <div class="orb orb-secondary"></div>

  <header class="site-header">
    <div class="brand-stack">
      <img alt="Hivepen logo" src="../public/img/logo/hivepen-logo-nobg.svg" width="52" height="52">
      <div>
        <p class="eyebrow">Profile hub</p>
        <h1 style="font-size: clamp(2rem, 4vw, 3rem);"><span>Hive</span><span>pen</span></h1>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="panel" style="max-width: 760px; margin: 0 auto; width: 100%;">
      <p class="section-label">Quick access</p>
      <h2 style="font-size: clamp(1.8rem, 4vw, 2.6rem);">Hive profile</h2>
      <p class="hero-copy">
        Get the <span x-text="username"></span> account links to popular Hive frontends
      </p>

      <div style="display:flex;gap:1rem;flex-direction:column;align-items:center;margin-top:1.5rem;">
        <img class="rounded-full avatar"
          :src="`https://images.hive.blog/u/${username != '' ? username : 'hivepen' }/avatar`"
          :alt="`Avatar for ${username}`">
        <div class="input-wrapper rounded-full">
          <b style="font-weight: 900;color:var(--primary)">@</b>
          <input class="username-input" placeholder="your username" x-model="username">
        </div>
        <div
          style="display:flex;gap:1rem;justify-content:center;align-items:center;flex-wrap:wrap;margin-block-start:1rem;">
          <a target="_blank" rel="noreferrer" :href="`https://ecency.com/@${username}`">Ecency</a>
          <a target="_blank" rel="noreferrer" :href="`https://inleo.io/profile/${username}`">InLeo</a>
          <a target="_blank" rel="noreferrer" :href="`https://hive.blog/@${username}`">Hive.blog</a>
          <a target="_blank" rel="noreferrer" :href="`https://peakd.com/@${username}`">PeakD</a>
        </div>
        <a :href="`https://hivepen.com/p/?u=${username}`"
          onclick="navigator.share('https://hivepen.com/p/?u='+username)">Share this profile hub</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      Founded by <a rel="noreferrer" href="./p?u=carlosepc">carlosepc</a>.
      Learn more about <a href="../index.html">Hivepen</a>.
    </p>
  </footer>
</body>

</html>
