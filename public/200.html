<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hivepen | Fallback</title>
    <meta
      name="description"
      content="Hivepen fallback page for static hosting environments that require a 200.html route."
    />
    <link rel="icon" href="/img/logo/hivepen-logo-nobg.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --primary: #fd9a0e;
        --secondary: #ff4c4c;
        --ink: #2a1b10;
        --muted: #6e6258;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #fff8f0 0%, #fffdf9 100%);
      }

      main {
        width: min(100%, 42rem);
        padding: 2rem;
        border-radius: 28px;
        border: 1px solid rgba(42, 27, 16, 0.08);
        background: rgba(255, 250, 245, 0.92);
        box-shadow: 0 24px 60px rgba(104, 52, 12, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3rem);
        color: var(--primary);
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: var(--secondary);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hivepen</h1>
      <p>
        This fallback page exists for static hosting setups that expect a <code>200.html</code> file.
      </p>
      <p>
        If you landed here directly, continue to the <a href="/">homepage</a>.
      </p>
    </main>
  </body>
</html>
